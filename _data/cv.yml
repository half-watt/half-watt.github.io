cv:
  name: "[PLACEHOLDER: full name]"
  label: "[PLACEHOLDER: job title / label]"
  email: placeholder@example.com
  location: "[PLACEHOLDER: city, state/country]"
  image: ""
  summary: "[PLACEHOLDER: professional summary / bio]"

  social_networks:
    - network: X
      username: PLACEHOLDER-X-USERNAME
    - network: GitHub
      username: PLACEHOLDER-GITHUB-USERNAME
    - network: LinkedIn
      username: PLACEHOLDER-LINKEDIN-USERNAME

  address:
    street: "[PLACEHOLDER: street address]"
    city: "[PLACEHOLDER: city]"
    region: "[PLACEHOLDER: state/region]"
    postalCode: "[PLACEHOLDER: postal code]"
    countryCode: US

  sections:
    Education:
      - institution: "[PLACEHOLDER: university/institution name]"
        location: "[PLACEHOLDER: city, country]"
        url: https://PLACEHOLDER-INSTITUTION-URL
        area: "[PLACEHOLDER: field of study]"
        studyType: "[PLACEHOLDER: degree type, e.g. PhD]"
        start_date: YYYY
        end_date: YYYY
        score: ""
        courses: "[PLACEHOLDER: relevant courses]"
        highlights:
          - "[PLACEHOLDER: highlight 1]"
          - "[PLACEHOLDER: highlight 2]"

    Experience:
      - company: "[PLACEHOLDER: company/institution name]"
        position: "[PLACEHOLDER: job title]"
        location: "[PLACEHOLDER: city, state]"
        start_date: YYYY
        end_date: YYYY
        summary: "[PLACEHOLDER: role summary]"
        highlights:
          - "[PLACEHOLDER: key achievement or responsibility]"
          - "[PLACEHOLDER: key achievement or responsibility]"

    Awards:
      - title: "[PLACEHOLDER: award name]"
        authors:
          - "[PLACEHOLDER: awarding organization]"
        date: YYYY-MM-DD
        awarder: "[PLACEHOLDER: awarding organization]"
        url: https://PLACEHOLDER-AWARD-URL
        summary: "[PLACEHOLDER: award description]"

    Publications:
      - title: "[PLACEHOLDER: publication title]"
        authors:
          - "[PLACEHOLDER: author name]"
        publisher: "[PLACEHOLDER: publisher/journal]"
        releaseDate: YYYY-MM-DD
        url: https://PLACEHOLDER-PUBLICATION-URL
        summary: "[PLACEHOLDER: publication summary]"

    Skills:
      - name: "[PLACEHOLDER: skill category]"
        level: "[PLACEHOLDER: level, e.g. Master]"
        icon: fa-solid fa-hashtag
        keywords: "[PLACEHOLDER: comma-separated skill keywords]"

    Languages:
      - name: "[PLACEHOLDER: language]"
        summary: "[PLACEHOLDER: proficiency level]"

    Interests:
      - name: "[PLACEHOLDER: interest area]"
        icon: fa-solid fa-tag
        keywords: "[PLACEHOLDER: comma-separated interest keywords]"

    Certificates:
      - name: "[PLACEHOLDER: certificate name]"
        date: YYYY-MM-DD
        issuer: "[PLACEHOLDER: issuing organization]"
        icon: fa-solid fa-location-dot

    Projects:
      - name: "[PLACEHOLDER: project name]"
        summary: "[PLACEHOLDER: project summary]"
        highlights:
          - "[PLACEHOLDER: project highlight]"
          - "[PLACEHOLDER: project highlight]"
        start_date: YYYY
        end_date: YYYY

    References:
      - name: "[PLACEHOLDER: reference name]"
        icon: fa-solid fa-laptop
        reference: "[PLACEHOLDER: reference text]"
