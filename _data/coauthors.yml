# Map co-author last names to their profile URLs so their names become clickable links in the bibliography.
# Add entries for each co-author whose name should be hyperlinked.
# Format:
#   "lastname":
#     - firstname: ["Full Name", "F.", "F. M."]
#       url: https://example.com/coauthor-profile
#
# PLACEHOLDER: Replace or add entries for your actual co-authors.
"PLACEHOLDER-LASTNAME":
  - firstname: ["PLACEHOLDER-FIRSTNAME", "P."]
    url: https://PLACEHOLDER-COAUTHOR-URL

"planck":
  - firstname: ["Max"]
    url: https://en.wikipedia.org/wiki/Max_Planck
